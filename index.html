<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin - เพิ่มจุด Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #AFCCEA; --bg-deep: #8FB7E0; --card: #F5F9FD; --card-line: #DCE7F3;
    --ink: #223449; --ink-dim: #6C8199; --teal: #3E93A6; --teal-dim: #DCEEF2;
    --green: #2FA36B; --red: #D9584D; --amber: #E08A2C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #C7DEF3 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color:var(--ink); font-family:'Noto Sans Thai', sans-serif; min-height:100vh;
    display:flex; justify-content:center; padding: 28px 16px 60px;
  }
  .wrap{ width:100%; max-width:520px; }
  .eyebrow{
    text-align:center; font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim); font-weight:600; margin-bottom:18px;
  }

  .tab-row{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{
    flex:1; padding:12px; border-radius:12px; border:1px solid var(--card-line);
    background:var(--card); color:var(--ink-dim); font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  .tab-btn.active{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .card{ background:var(--card); border:1px solid var(--card-line); border-radius:20px; padding:22px; margin-bottom:16px; }
  label{ display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px; font-weight:600; }
  input, input[type="file"]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--card-line);
    background:#EDF3FA; color:var(--ink); font-size:16px; font-family:inherit; margin-bottom:16px;
  }
  input::placeholder{ color:#9FB2C7; }
  input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  button{
    width:100%; padding:14px; border-radius:12px; border:none; font-size:16px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  button:disabled{ opacity:.5; }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-secondary{ background:var(--teal-dim); color:var(--teal); margin-bottom:16px; }
  .msg{ font-size:13px; font-weight:600; margin:-8px 0 14px; display:none; }
  .msg.error{ color:var(--red); }
  .msg.success{ color:var(--green); }
  .gps-box{
    background:#EDF3FA; border-radius:12px; padding:12px 14px; margin-bottom:16px;
    font-size:13px; color:var(--ink-dim); font-family:'Space Grotesk', sans-serif;
  }
  .gps-box.got{ color:var(--green); font-weight:700; }
  .preview{
    width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:16px; display:none;
  }
  .hidden{ display:none !important; }
  .list-item{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--card-line);
    font-size:13.5px;
  }
  .list-item:last-child{ border-bottom:none; }
  .list-item img{ width:40px; height:40px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--teal-dim); }
  .list-id{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--teal); }

  /* ---- Report tab ---- */
  .btn-export{ background:var(--green); }
  select{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--card-line);
    background:#EDF3FA; color:var(--ink); font-size:15px; font-family:inherit; margin-bottom:14px;
  }
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .toolbar select{ flex:1; min-width:130px; margin-bottom:0; }
  .toolbar button{ width:auto; margin-bottom:0; white-space:nowrap; }
  .summary-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .summary-chip{ flex:1; min-width:80px; background:#EDF3FA; border-radius:12px; padding:9px 10px; text-align:center; }
  .summary-chip .num{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; }
  .summary-chip .lbl{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td{ padding:8px 7px; text-align:left; border-bottom:1px solid var(--card-line); white-space:nowrap; }
  th{ color:var(--ink-dim); font-weight:700; font-size:11px; text-transform:uppercase; }
  td.caption-cell{ white-space:normal; max-width:150px; }
  .status-pill{ padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .status-playing{ background:var(--teal-dim); color:var(--teal); }
  .status-success{ background:#D9F2E4; color:var(--green); }
  .status-failed{ background:#FBE1DD; color:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Admin Panel</div>

  <!-- PASSWORD GATE -->
  <div id="gateCard" class="card">
    <label for="pwInput">รหัสผ่าน Admin</label>
    <input id="pwInput" type="password" placeholder="กรอกรหัสผ่าน" inputmode="numeric">
    <div id="gateError" class="msg error">รหัสผ่านไม่ถูกต้อง</div>
    <button id="unlockBtn" class="btn-primary">เข้าสู่ระบบ</button>
  </div>

  <!-- TABS -->
  <div id="tabRow" class="tab-row hidden">
    <button id="tabAddBtn" class="tab-btn active" type="button">➕ Add Checkpoint</button>
    <button id="tabReportBtn" class="tab-btn" type="button">📊 Report</button>
  </div>

  <!-- ADD CHECKPOINT FORM -->
  <div id="formCard" class="card hidden">
    <div id="editBanner" class="hidden" style="background:var(--teal-dim); color:var(--teal); padding:10px 14px; border-radius:12px; margin-bottom:14px; font-weight:700; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <span>✏️ กำลังแก้ไขจุด <span id="editingIdLabel"></span></span>
      <button id="cancelEditBtn" type="button" style="width:auto; padding:6px 12px; font-size:12px; background:#fff; color:var(--teal); border-radius:8px;">ยกเลิก</button>
    </div>

    <label for="cpName">ชื่อจุด</label>
    <input id="cpName" type="text" placeholder="เช่น ลานหน้าตึกอำนวยการ">

    <label for="cpRadius">รัศมี (เมตร)</label>
    <input id="cpRadius" type="number" value="15">

    <label for="cpZone">โซน (ไม่บังคับ — ใช้ช่วยกระจายการสุ่ม ผู้เล่นไม่เห็น)</label>
    <input id="cpZone" type="text" placeholder="เช่น A, B, ตึกเหนือ, ตึกใต้" list="zoneSuggestions">
    <datalist id="zoneSuggestions"></datalist>

    <button id="gpsBtn" class="btn-secondary" type="button">📍 จับพิกัด GPS ปัจจุบัน</button>
    <div id="gpsBox" class="gps-box">ยังไม่ได้จับพิกัด กดปุ่มด้านบนตอนยืนอยู่ ณ จุดจริง</div>

    <label for="cpPhoto">ถ่ายรูปสถานที่ (ไม่บังคับ)</label>
    <input id="cpPhoto" type="file" accept="image/*" capture="environment">
    <img id="photoPreview" class="preview" alt="ตัวอย่างรูป">

    <div id="formError" class="msg error"></div>
    <div id="formSuccess" class="msg success"></div>

    <button id="submitBtn" class="btn-primary">✅ บันทึกจุดนี้</button>
  </div>

  <!-- RECENT LIST -->
  <div id="listCard" class="card hidden">
    <label style="margin-bottom:12px;">จุดที่มีอยู่ในระบบ</label>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button id="enableAllBtn" type="button" style="flex:1; padding:9px; font-size:12.5px; background:var(--teal-dim); color:var(--teal); border-radius:9px; border:none; font-weight:700;">✅ เปิดใช้ทั้งหมด</button>
      <button id="disableAllBtn" type="button" style="flex:1; padding:9px; font-size:12.5px; background:#FBE1DD; color:var(--red); border-radius:9px; border:none; font-weight:700;">⛔ ปิดใช้ทั้งหมด</button>
    </div>
    <div id="cpListBox"></div>
  </div>

  <!-- REPORT TAB -->
  <div id="reportCard" class="card hidden">
    <div class="summary-row" id="summaryRow"></div>

    <input id="searchInput" type="text" placeholder="🔍 ค้นหา SAP ID หรือชื่อ">

    <div class="toolbar">
      <select id="statusFilter">
        <option value="all">ทุกสถานะ</option>
        <option value="playing">กำลังเล่นอยู่</option>
        <option value="success">ผ่านภารกิจ</option>
        <option value="failed">หมดเวลา</option>
      </select>
      <select id="sortSelect">
        <option value="date_desc">วันที่ล่าสุดก่อน</option>
        <option value="date_asc">วันที่เก่าสุดก่อน</option>
        <option value="id_asc">SAP ID น้อย → มาก</option>
        <option value="id_desc">SAP ID มาก → น้อย</option>
      </select>
    </div>
    <div class="toolbar">
      <input id="dateFilter" type="date" style="flex:1; min-width:130px; margin-bottom:0;">
      <button id="clearDateBtn" class="btn-secondary" type="button" style="width:auto; margin-bottom:0;">ล้างวันที่</button>
    </div>
    <div class="toolbar">
      <button id="refreshBtn" class="btn-primary">🔄 รีเฟรช</button>
      <button id="exportBtn" class="btn-export">📥 Export</button>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>SAP ID</th><th>ชื่อ</th><th>สถานะ</th><th>ครั้งที่</th><th>CP</th><th>เครดิต</th><th>สุ่มพิกัด</th>
            <th>วันที่</th><th>เริ่ม</th><th>สิ้นสุด</th><th>ใช้เวลา</th><th>แคปชั่น</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxDT_FV166DJyKIpzvHOYyYfWDufoUOKX_5YIZu5xhr05tYm0pPMljf-rdAMdfYxrnZ/exec";
  const ADMIN_CODE = "9999";
  let capturedPos = null;
  let capturedPhotoBase64 = null;
  let capturedPhotoMime = null;
  let editingId = null;

  const gateCard = document.getElementById("gateCard");
  const tabRow = document.getElementById("tabRow");
  const formCard = document.getElementById("formCard");
  const listCard = document.getElementById("listCard");
  const reportCard = document.getElementById("reportCard");
  let allPlayers = [];

  // ---------- ด่านรหัสผ่าน ----------
  document.getElementById("unlockBtn").addEventListener("click", () => {
    const pw = document.getElementById("pwInput").value.trim();
    const errEl = document.getElementById("gateError");
    if (pw !== ADMIN_CODE) {
      errEl.style.display = "block";
      return;
    }
    errEl.style.display = "none";
    gateCard.classList.add("hidden");
    tabRow.classList.remove("hidden");
    formCard.classList.remove("hidden");
    listCard.classList.remove("hidden");
    loadCheckpointList();
  });

  // ---------- สลับแท็บ ----------
  document.getElementById("tabAddBtn").addEventListener("click", () => {
    document.getElementById("tabAddBtn").classList.add("active");
    document.getElementById("tabReportBtn").classList.remove("active");
    formCard.classList.remove("hidden");
    listCard.classList.remove("hidden");
    reportCard.classList.add("hidden");
  });

  document.getElementById("tabReportBtn").addEventListener("click", () => {
    document.getElementById("tabReportBtn").classList.add("active");
    document.getElementById("tabAddBtn").classList.remove("active");
    formCard.classList.add("hidden");
    listCard.classList.add("hidden");
    reportCard.classList.remove("hidden");
    loadPlayers();
  });

  // ---------- จับพิกัด GPS ----------
  document.getElementById("gpsBtn").addEventListener("click", () => {
    const box = document.getElementById("gpsBox");
    box.textContent = "กำลังหาตำแหน่ง...";
    box.classList.remove("got");

    if (!("geolocation" in navigator)) {
      box.textContent = "อุปกรณ์นี้ไม่รองรับ GPS";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        capturedPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const acc = Math.round(pos.coords.accuracy);
        box.textContent = `✓ พิกัด: ${capturedPos.lat.toFixed(6)}, ${capturedPos.lng.toFixed(6)} (ความแม่นยำ ±${acc} ม.)`;
        box.classList.add("got");
      },
      (err) => {
        box.textContent = "ไม่สามารถจับพิกัดได้ ตรวจสอบว่าอนุญาต Location แล้ว";
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  });

  // ---------- เลือก/ถ่ายรูป: ย่อขนาดก่อนแปลงเป็น base64 กันไฟล์ใหญ่เกินไปจนอัปโหลดค้าง ----------
  document.getElementById("cpPhoto").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const MAX_W = 1200;
        const scale = Math.min(1, MAX_W / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

        const resizedDataUrl = canvas.toDataURL("image/jpeg", 0.75);
        capturedPhotoBase64 = resizedDataUrl.split(",")[1];
        capturedPhotoMime = "image/jpeg";

        const preview = document.getElementById("photoPreview");
        preview.src = resizedDataUrl;
        preview.style.display = "block";
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  // ---------- โหมดแก้ไข: เติมฟอร์มด้วยข้อมูลจุดเดิม แล้วสลับปุ่มไปเป็น "บันทึกการแก้ไข" ----------
  function enterEditMode(cp) {
    editingId = cp.id;
    document.getElementById("cpName").value = cp.name;
    document.getElementById("cpRadius").value = cp.radius;
    document.getElementById("cpZone").value = cp.zone || "";
    capturedPos = { lat: cp.lat, lng: cp.lng };
    capturedPhotoBase64 = null;
    capturedPhotoMime = null;

    const gpsBox = document.getElementById("gpsBox");
    gpsBox.textContent = `📍 ตำแหน่งเดิมของจุดนี้: ${cp.lat.toFixed(6)}, ${cp.lng.toFixed(6)} (กดปุ่มด้านบนถ้าต้องการจับพิกัดใหม่ ณ ตำแหน่งปัจจุบัน)`;
    gpsBox.classList.add("got");

    const preview = document.getElementById("photoPreview");
    if (cp.imageUrl) {
      preview.src = toDirectImageUrl(cp.imageUrl);
      preview.style.display = "block";
    } else {
      preview.style.display = "none";
    }
    document.getElementById("cpPhoto").value = "";

    document.getElementById("editingIdLabel").textContent = cp.id;
    document.getElementById("editBanner").classList.remove("hidden");
    document.getElementById("submitBtn").textContent = "💾 บันทึกการแก้ไข";
    document.getElementById("formError").style.display = "none";
    document.getElementById("formSuccess").style.display = "none";

    formCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function exitEditMode() {
    editingId = null;
    document.getElementById("cpName").value = "";
    document.getElementById("cpRadius").value = "15";
    document.getElementById("cpZone").value = "";
    document.getElementById("cpPhoto").value = "";
    document.getElementById("photoPreview").style.display = "none";
    document.getElementById("gpsBox").textContent = "ยังไม่ได้จับพิกัด กดปุ่มด้านบนตอนยืนอยู่ ณ จุดจริง";
    document.getElementById("gpsBox").classList.remove("got");
    capturedPos = null;
    capturedPhotoBase64 = null;
    capturedPhotoMime = null;
    document.getElementById("editBanner").classList.add("hidden");
    document.getElementById("submitBtn").textContent = "✅ บันทึกจุดนี้";
  }

  document.getElementById("cancelEditBtn").addEventListener("click", exitEditMode);

  // ---------- ลบจุด ----------
  async function handleDeleteCheckpoint(cp) {
    if (!confirm(`ลบจุด ${cp.id} — ${cp.name} ใช่หรือไม่? การลบนี้ย้อนกลับไม่ได้`)) return;

    try {
      const fd = new FormData();
      fd.append("action", "deleteCheckpoint");
      fd.append("adminCode", ADMIN_CODE);
      fd.append("id", cp.id);

      const res = await fetch(API_URL, { method: "POST", body: fd, signal: AbortSignal.timeout(30000) });
      const data = await res.json();

      if (!data.success) {
        alert(data.error || "ลบไม่สำเร็จ");
        return;
      }

      if (editingId === cp.id) exitEditMode();
      loadCheckpointList();
    } catch (e) {
      alert("เชื่อมต่อไม่สำเร็จ: " + e.message);
    }
  }

  // ---------- เปิด/ปิดใช้งานจุดเดียว: เปลี่ยนไอคอนทันทีตอนกด (optimistic) แล้วค่อยยืนยันกับ server ----------
  // ---------- คำนวณระยะทาง (Haversine) หน่วยเมตร ----------
  function haversineDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  let lastTestResultEl = null; // เก็บ element ผลลัพธ์ล่าสุดที่โชว์อยู่ กันโชว์ซ้อนกันหลายจุดพร้อมกัน

  // ---------- แปลระยะทางเป็นหมวด (เกณฑ์เดียวกับหน้าผู้เล่น) ----------
  function getDistanceCategory(dist, radius) {
    if (dist <= radius) return { label: "เช็คอิน", color: "var(--green)" };
    if (dist <= 100) return { label: "ใกล้", color: "var(--amber)" };
    if (dist <= 200) return { label: "ปานกลาง", color: "var(--teal)" };
    return { label: "ไกล", color: "var(--ink-dim)" };
  }

  // ---------- ทดสอบเช็คอิน: ใช้ GPS ปัจจุบันของแอดมิน วัดระยะไปยังจุดนี้ตรงๆ (ไม่กระทบข้อมูลผู้เล่นเลย) ----------
  function handleTestCheckin(cp, btnEl, rowEl) {
    const resultEl = rowEl.querySelector(".test-result");

    // ปิดผลลัพธ์เก่าที่โชว์ค้างอยู่ (ถ้ามี) ก่อนเริ่มทดสอบจุดใหม่
    if (lastTestResultEl && lastTestResultEl !== resultEl) {
      lastTestResultEl.style.display = "none";
      lastTestResultEl.textContent = "";
    }
    lastTestResultEl = resultEl;

    if (!("geolocation" in navigator)) {
      resultEl.style.display = "block";
      resultEl.style.color = "var(--red)";
      resultEl.textContent = "อุปกรณ์นี้ไม่รองรับ GPS";
      return;
    }

    const originalText = btnEl.textContent;
    btnEl.disabled = true;
    btnEl.textContent = "⏳";
    resultEl.style.display = "block";
    resultEl.style.color = "var(--ink-dim)";
    resultEl.textContent = "กำลังหาตำแหน่งของคุณ...";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const myLat = pos.coords.latitude;
        const myLng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);
        const dist = haversineDistance(myLat, myLng, cp.lat, cp.lng);
        const cat = getDistanceCategory(dist, cp.radius);

        resultEl.style.color = cat.color;
        resultEl.textContent = `ระยะ ${cat.label} (${Math.round(dist)} ม.) : GPS ±${acc} ม.`;

        btnEl.disabled = false;
        btnEl.textContent = originalText;
      },
      (err) => {
        resultEl.style.color = "var(--red)";
        resultEl.textContent = "หาตำแหน่งไม่สำเร็จ ตรวจสอบว่าอนุญาต Location แล้ว";
        btnEl.disabled = false;
        btnEl.textContent = originalText;
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  async function handleToggleCheckpoint(cp, btnEl, rowEl) {
    const newActive = !cp.active;

    // อัปเดตหน้าตาไอคอนทันที ไม่ต้องรอ network response ให้ผู้ใช้เห็นผลทันทีที่กด
    btnEl.textContent = newActive ? "✅" : "⛔";
    btnEl.title = newActive ? "ปิดใช้งาน" : "เปิดใช้งาน";
    btnEl.style.background = newActive ? "var(--teal-dim)" : "#EEF1F5";
    btnEl.style.color = newActive ? "var(--teal)" : "#8A97A6";
    rowEl.style.opacity = newActive ? "1" : "0.45";
    btnEl.disabled = true;

    try {
      const fd = new FormData();
      fd.append("action", "toggleCheckpoint");
      fd.append("adminCode", ADMIN_CODE);
      fd.append("id", cp.id);
      fd.append("active", String(newActive));

      const res = await fetch(API_URL, { method: "POST", body: fd, signal: AbortSignal.timeout(30000) });
      const data = await res.json();

      if (!data.success) {
        // ทำไม่สำเร็จจริง -> ย้อนหน้าตาไอคอนกลับเป็นค่าเดิม แล้วแจ้ง error
        btnEl.textContent = cp.active ? "✅" : "⛔";
        btnEl.title = cp.active ? "ปิดใช้งาน" : "เปิดใช้งาน";
        btnEl.style.background = cp.active ? "var(--teal-dim)" : "#EEF1F5";
        btnEl.style.color = cp.active ? "var(--teal)" : "#8A97A6";
        rowEl.style.opacity = cp.active ? "1" : "0.45";
        alert(data.error || "เปลี่ยนสถานะไม่สำเร็จ");
        return;
      }
      cp.active = newActive; // sync ค่าใน object เผื่อกดซ้ำอีกครั้งก่อน reload
    } catch (e) {
      // เชื่อมต่อไม่สำเร็จ -> ย้อนหน้าตากลับเหมือนกัน
      btnEl.textContent = cp.active ? "✅" : "⛔";
      rowEl.style.opacity = cp.active ? "1" : "0.45";
      alert("เชื่อมต่อไม่สำเร็จ: " + e.message);
    } finally {
      btnEl.disabled = false;
    }
  }

  // ---------- เปิด/ปิดใช้งานจุดทั้งหมด ----------
  async function handleToggleAll(active) {
    const label = active ? "เปิดใช้งานจุดทั้งหมด" : "ปิดใช้งานจุดทั้งหมด";
    if (!confirm(`ยืนยัน ${label} ใช่หรือไม่?`)) return;

    // อัปเดตหน้าจอทุกแถวทันที ไม่ต้องรอ network เพื่อให้เห็นผลทันทีที่กด (เหมือนปุ่มเดี่ยว)
    document.querySelectorAll("#cpListBox .list-item").forEach(row => {
      row.style.opacity = active ? "1" : "0.45";
      const btn = row.querySelector(".list-toggle-btn");
      if (btn) {
        btn.textContent = active ? "✅" : "⛔";
        btn.title = active ? "ปิดใช้งาน" : "เปิดใช้งาน";
        btn.style.background = active ? "var(--teal-dim)" : "#EEF1F5";
        btn.style.color = active ? "var(--teal)" : "#8A97A6";
      }
    });

    try {
      const fd = new FormData();
      fd.append("action", "toggleAllCheckpoints");
      fd.append("adminCode", ADMIN_CODE);
      fd.append("active", String(active));

      const res = await fetch(API_URL, { method: "POST", body: fd, signal: AbortSignal.timeout(30000) });
      const data = await res.json();

      if (!data.success) {
        alert(data.error || "ทำรายการไม่สำเร็จ");
        loadCheckpointList(); // ทำไม่สำเร็จจริง -> โหลดข้อมูลจริงกลับมาให้ตรง
        return;
      }
      // sync ให้แน่ใจว่าตรงกับ server 100% (เผื่อบางจุดเขียนไม่ครบ)
      loadCheckpointList();
    } catch (e) {
      alert("เชื่อมต่อไม่สำเร็จ: " + e.message);
      loadCheckpointList();
    }
  }

  document.getElementById("enableAllBtn").addEventListener("click", () => handleToggleAll(true));
  document.getElementById("disableAllBtn").addEventListener("click", () => handleToggleAll(false));

  // ---------- บันทึกจุด (เพิ่มใหม่ หรือ แก้ไขจุดเดิม ตามว่ามี editingId อยู่หรือไม่) ----------
  document.getElementById("submitBtn").addEventListener("click", async () => {
    const name = document.getElementById("cpName").value.trim();
    const radius = document.getElementById("cpRadius").value || "15";
    const zone = document.getElementById("cpZone").value.trim();
    const errEl = document.getElementById("formError");
    const okEl = document.getElementById("formSuccess");

    okEl.style.display = "none";

    if (!name) {
      errEl.textContent = "กรอกชื่อจุดก่อนครับ";
      errEl.style.display = "block";
      return;
    }
    if (!capturedPos) {
      errEl.textContent = "ต้องกดจับพิกัด GPS ก่อนบันทึก";
      errEl.style.display = "block";
      return;
    }

    const submitBtn = document.getElementById("submitBtn");
    const isEditing = !!editingId;
    submitBtn.disabled = true;
    submitBtn.textContent = isEditing ? "กำลังบันทึกการแก้ไข..." : "กำลังบันทึก...";

    try {
      const fd = new FormData();
      fd.append("action", isEditing ? "editCheckpoint" : "addCheckpoint");
      if (isEditing) fd.append("id", editingId);
      fd.append("adminCode", ADMIN_CODE);
      fd.append("name", name);
      fd.append("lat", capturedPos.lat);
      fd.append("lng", capturedPos.lng);
      fd.append("radius", radius);
      fd.append("zone", zone);
      if (capturedPhotoBase64) {
        fd.append("imageBase64", capturedPhotoBase64);
        fd.append("imageMimeType", capturedPhotoMime);
      }

      const res = await fetch(API_URL, {
        method: "POST",
        body: fd,
        signal: AbortSignal.timeout(45000) // กันค้างไม่รู้จบ ถ้าเกิน 45 วิ ให้ยกเลิกแล้วแจ้ง error
      });
      const data = await res.json();

      if (!data.success) {
        errEl.textContent = data.error || (isEditing ? "แก้ไขไม่สำเร็จ" : "บันทึกไม่สำเร็จ");
        errEl.style.display = "block";
        return;
      }

      okEl.textContent = data.imageWarning
        ? `✅ ${isEditing ? "แก้ไขจุดสำเร็จ" : "บันทึกจุดสำเร็จ"} (รหัส: ${data.id}) แต่ ⚠️ ${data.imageWarning}`
        : `✅ ${isEditing ? "แก้ไขจุดสำเร็จ!" : "บันทึกสำเร็จ!"} รหัสจุด: ${data.id}`;
      okEl.style.display = "block";

      exitEditMode(); // เคลียร์ฟอร์มกลับเป็นโหมดเพิ่มจุดใหม่เสมอหลังบันทึกสำเร็จ
      loadCheckpointList();
    } catch (e) {
      errEl.textContent = e.name === "TimeoutError" || e.name === "AbortError"
        ? "ใช้เวลานานเกินไป (เกิน 45 วิ) เครือข่ายอาจช้า ลองใหม่อีกครั้ง หรือไม่แนบรูปดูก่อน"
        : "เชื่อมต่อไม่สำเร็จ: " + e.message;
      errEl.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = editingId ? "💾 บันทึกการแก้ไข" : "✅ บันทึกจุดนี้";
    }
  });

  // ---------- แปลงลิงก์ Google Drive ให้เป็นลิงก์รูปภาพที่ใช้กับ <img> ได้จริง ----------
  function toDirectImageUrl(url) {
    if (!url) return "";
    const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m && m[1]) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
    return url;
  }

          <div class="test-result" style="display:none; font-size:11.5px; font-weight:700; margin-top:3px;"></div>
          </div>
          <div style="display:flex; flex-direction:row; gap:5px; flex-shrink:0; justify-content:flex-end;">
            <button class="list-test-btn" type="button" title="ทดสอบเช็คอิน (ใช้ GPS ปัจจุบันของคุณ)" style="width:auto; padding:5px 7px; font-size:12px; background:#FBE9D2; color:var(--amber); border-radius:7px; line-height:1;">🧪</button>
            <button class="list-toggle-btn" type="button" title="${cp.active ? "ปิดใช้งาน" : "เปิดใช้งาน"}" style="width:auto; padding:5px 7px; font-size:12px; background:${cp.active ? "var(--teal-dim)" : "#EEF1F5"}; color:${cp.active ? "var(--teal)" : "#8A97A6"}; border-radius:7px; line-height:1;">${cp.active ? "✅" : "⛔"}</button>
            <button class="list-edit-btn" type="button" title="แก้ไข" style="width:auto; padding:5px 7px; font-size:12px; background:var(--teal-dim); color:var(--teal); border-radius:7px; line-height:1;">✏️</button>

        row.querySelector(".list-test-btn").addEventListener("click", (e) => handleTestCheckin(cp, e.currentTarget, row));

  // ---------- REPORT TAB ----------
  function loadPlayers() {
    const tbody = document.getElementById("tableBody");

  function formatDate(ms) {
    if (!ms) return "-";
    return new Date(ms).toLocaleDateString("th-TH", { day: "2-digit", month: "2-digit", year: "2-digit" });
  }

  // ---------- แปลงค่า "วันที่" ให้เป็น dd/mm/yy เสมอ ไม่ว่าจากฝั่ง Sheet จะส่งมาเป็นรูปแบบไหน ----------
  // รองรับทั้ง string "2026-09-10" ปกติ และกรณีที่ Google Sheets แอบแปลง string เป็น Date
  // แล้ว Apps Script ส่งกลับมาเป็น string ยาวแบบ "Thu Sep 10 2026 00:00:00 GMT+0700 (GMT+07:00)"
  // คำนวณ dd/mm/yy เองแบบ manual (ไม่พึ่ง toLocaleDateString) กันปัญหาปี พ.ศ. จาก locale th-TH
  function formatDateSafe(dateValue, fallbackMs) {
    let d = null;
    if (dateValue) {
      const parsed = new Date(dateValue);
      if (!isNaN(parsed.getTime())) d = parsed;
    }
    if (!d && fallbackMs) {
      const parsedFallback = new Date(fallbackMs);
      if (!isNaN(parsedFallback.getTime())) d = parsedFallback;
    }
    if (!d) return "-";
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yy = String(d.getFullYear() % 100).padStart(2, "0");
    return `${dd}/${mm}/${yy}`;
  }

  function formatTime(ms) {
    if (!ms) return "-";
    return new Date(ms).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  }

  function formatDuration(ms) {
    if (ms == null) return "-";
    const totalSec = Math.floor(ms / 1000);
    const min = Math.floor(totalSec / 60);
    const sec = String(totalSec % 60).padStart(2, "0");
    return `${min}.${sec}`;
  }

  const STATUS_LABEL = { playing: "กำลังเล่น", success: "ผ่านภารกิจ", failed: "หมดเวลา" };

  function renderSummary() {
    const filtered = getFilteredPlayers();
    const total = filtered.length;
    const success = filtered.filter(p => p.status === "success").length;
    const failed = filtered.filter(p => p.status === "failed").length;
    const playing = filtered.filter(p => p.status === "playing").length;
    const totalCredits = filtered.reduce((sum, p) => sum + (p.creditsToday || 0), 0);

    document.getElementById("summaryRow").innerHTML = `
      <div class="summary-chip"><div class="num">${total}</div><div class="lbl">ทั้งหมด</div></div>
      <div class="summary-chip"><div class="num" style="color:var(--green)">${success}</div><div class="lbl">ผ่าน</div></div>
      <div class="summary-chip"><div class="num" style="color:var(--red)">${failed}</div><div class="lbl">หมดเวลา</div></div>
      <div class="summary-chip"><div class="num" style="color:var(--teal)">${playing}</div><div class="lbl">กำลังเล่น</div></div>
      <div class="summary-chip"><div class="num" style="color:var(--amber)">${totalCredits}</div><div class="lbl">เครดิตรวม</div></div>
    `;
  }

  function getFilteredPlayers() {
    const filter = document.getElementById("statusFilter").value;
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const sortBy = document.getElementById("sortSelect").value;
    const dateValue = document.getElementById("dateFilter").value; // "yyyy-MM-dd" หรือว่าง

    let list = allPlayers;
    if (filter !== "all") list = list.filter(p => p.status === filter);
    if (dateValue) list = list.filter(p => p.date === dateValue);
    if (keyword) {
      list = list.filter(p =>
        String(p.playerId).toLowerCase().includes(keyword) ||
        String(p.name).toLowerCase().includes(keyword)
      );
    }

    list = list.slice().sort((a, b) => {
      if (sortBy === "date_desc") return b.startTime - a.startTime;
      if (sortBy === "date_asc") return a.startTime - b.startTime;
      if (sortBy === "id_asc") return String(a.playerId).localeCompare(String(b.playerId), undefined, { numeric: true });
      if (sortBy === "id_desc") return String(b.playerId).localeCompare(String(a.playerId), undefined, { numeric: true });
      return 0;
    });

    return list;
  }

  function renderTable() {
    const players = getFilteredPlayers();
    const tbody = document.getElementById("tableBody");

    if (!players.length) {
      tbody.innerHTML = `<tr><td colspan="12">ไม่มีข้อมูลตามเงื่อนไขนี้</td></tr>`;
      return;
    }

    tbody.innerHTML = players.map(p => `
      <tr>
        <td>${p.playerId}</td>
        <td>${p.name}</td>
        <td><span class="status-pill status-${p.status}">${STATUS_LABEL[p.status] || p.status}</span></td>
        <td>${p.attemptCount}/2</td>
        <td>${p.score}/5</td>
        <td>${p.creditsToday}</td>
        <td>${p.rerollCount || 0}</td>
        <td>${formatDateSafe(p.date, p.startTime)}</td>
        <td>${formatTime(p.startTime)}</td>
        <td>${formatTime(p.finishTime)}</td>
        <td>${formatDuration(p.durationMs)}</td>
        <td class="caption-cell">${p.caption || "-"}</td>
      </tr>
    `).join("");
  }

  function refreshView() {
    renderSummary();
    renderTable();
  }

  document.getElementById("statusFilter").addEventListener("change", refreshView);
  document.getElementById("sortSelect").addEventListener("change", refreshView);
  document.getElementById("searchInput").addEventListener("input", refreshView);
  document.getElementById("dateFilter").addEventListener("change", refreshView);
  document.getElementById("clearDateBtn").addEventListener("click", () => {
    document.getElementById("dateFilter").value = "";
    refreshView();
  });
  document.getElementById("refreshBtn").addEventListener("click", loadPlayers);

  // ---------- หา "วันจันทร์" ของสัปดาห์นั้น (Date object เที่ยงคืน) ----------
  function getMondayOfWeek(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay(); // 0=อาทิตย์ 1=จันทร์ ... 6=เสาร์
    const diffToMonday = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diffToMonday);
    return d;
  }

  // ---------- หาช่วง "สัปดาห์ที่ผ่านมาล่าสุดแบบครบสมบูรณ์" (จ-อา) เทียบกับวันนี้ ----------
  // สัปดาห์ปัจจุบันที่ยังไม่จบ (ยังไม่ถึงวันอาทิตย์) จะไม่ถูกนับ เอาแค่สัปดาห์ก่อนหน้าที่จบไปแล้วเท่านั้น
  function getLastCompletedWeekRange() {
    const thisMonday = getMondayOfWeek(new Date().toISOString().slice(0, 10));
    const lastMonday = new Date(thisMonday);
    lastMonday.setDate(lastMonday.getDate() - 7);
    const lastSunday = new Date(lastMonday);
    lastSunday.setDate(lastSunday.getDate() + 6);
    return { monday: lastMonday, sunday: lastSunday };
  }

  function isDateInRange(dateStr, monday, sunday) {
    const d = new Date(dateStr + "T00:00:00");
    return d >= monday && d <= sunday;
  }

  // ---------- รวมเครดิตต่อคนจากรายการ player rows ที่กรองมาแล้ว ----------
  function aggregateCreditsByPerson(playerRows) {
    const personMap = new Map();
    playerRows.forEach(p => {
      if (!personMap.has(p.playerId)) personMap.set(p.playerId, { name: p.name, credits: 0 });
      const e = personMap.get(p.playerId);
      e.name = p.name; // ใช้ชื่อล่าสุดที่เจอ
      e.credits += (p.creditsToday || 0);
    });
    const sortedIds = [...personMap.keys()].sort((a, b) =>
      String(a).localeCompare(String(b), undefined, { numeric: true })
    );
    return sortedIds.map(id => ({ id, name: personMap.get(id).name, credits: personMap.get(id).credits }));
  }

  // ---------- Sheet 1: เครดิตของสัปดาห์ที่ผ่านมาล่าสุด (จ-อา เดียว) ----------
  // ถ้าสัปดาห์นี้ยังไม่จบ (ยังไม่ถึงวันอาทิตย์) จะไม่แสดงสัปดาห์ปัจจุบัน แต่แสดงสัปดาห์ก่อนหน้าแทนเสมอ
  function buildLastWeekSheet() {
    const { monday, sunday } = getLastCompletedWeekRange();
    const rangeLabel = `${formatDate(monday)} - ${formatDate(sunday)}`;
    const relevant = allPlayers.filter(p => p.date && isDateInRange(p.date, monday, sunday));
    if (!relevant.length) return null;

    const summary = aggregateCreditsByPerson(relevant);
    return summary.map(s => ({
      "สัปดาห์ (จ-อา)": rangeLabel,
      "SAP ID": s.id,
      "ชื่อ": s.name,
      "เครดิต": s.credits
    }));
  }

  // ---------- Sheet 2: เครดิตรวมทั้งหมด (ทุกวันที่มีข้อมูล) ----------
  function buildTotalCreditsSheet() {
    const relevant = allPlayers.filter(p => p.date);
    if (!relevant.length) return null;

    const summary = aggregateCreditsByPerson(relevant);
    return summary.map(s => ({
      "SAP ID": s.id,
      "ชื่อ": s.name,
      "เครดิตรวมทั้งหมด": s.credits
    }));
  }

  document.getElementById("exportBtn").addEventListener("click", () => {
    const players = getFilteredPlayers();
    const rows = players.map(p => ({
      "SAP ID": p.playerId,
      "ชื่อ": p.name,
      "CP": `${p.score}/5`,
      "ครั้งที่": `${p.attemptCount}/2`,
      "สุ่มพิกัด": p.rerollCount || 0,
      "เครดิต": p.creditsToday,
      "สถานะ": STATUS_LABEL[p.status] || p.status,
      "วันที่": formatDateSafe(p.date, p.startTime),
      "เริ่ม": formatTime(p.startTime),
      "สิ้นสุด": formatTime(p.finishTime),
      "ใช้เวลา": formatDuration(p.durationMs),
      "แคปชั่น": p.caption || ""
    }));

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "รายงานผล");

    const lastWeekRows = buildLastWeekSheet();
    if (lastWeekRows && lastWeekRows.length) {
      const lastWeekWs = XLSX.utils.json_to_sheet(lastWeekRows);
      XLSX.utils.book_append_sheet(wb, lastWeekWs, "เครดิตรายสัปดาห์");
    }

    const totalRows = buildTotalCreditsSheet();
    if (totalRows && totalRows.length) {
      const totalWs = XLSX.utils.json_to_sheet(totalRows);
      XLSX.utils.book_append_sheet(wb, totalWs, "เครดิตรวมทั้งหมด");
    }

    const today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `checkpoint-mission-report-${today}.xlsx`);
  });
</script>
</body>
</html>
